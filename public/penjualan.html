        tailwind.config = {

    <style>

                    " class="block py-2 font-bold text-accent">Pendapatan</a></li>

    <!-- Desktop Sidebar -->
    <aside class="hidden md:block w-64 bg-element-bg h-screen fixed top-0 left-0 border-r border-accent">
        <div class="p-4">
            <div class="w-10 h-10 rounded-full bg-accent mb-6 flex items-center justify-center">
                <span class="text-white">U</span>
            </div>
            <ul class="space-y-4">
                <li><a href="index.html" class="block py-2">Dashboard</a></li>
                <li><a href="produk.html" class="block py-2">Produk</a></li>

    <!-- Main Content -->
    <!-- Main Content -->
<main class="md:ml-64 p-4 pb-20 md:pb-20">

    <!-- Product List (rendered from API) -->
    <div id="sales-list" class="space-y-3">
        <div class="col-span-full text-text-secondary text-center">Memuat produk...</div>
    </div>
</main>

<div class="fixed bottom-4 right-4 z-10">
    <button id="confirm-sales-btn" class="bg-element-bg text-accent w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center shadow-lg hover:bg-accent hover:text-white transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-accent">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span class="sr-only">Konfirmasi Penjualan</span>
    </button>
    
    <!-- Optional: Label teks di atas tombol (mobile only) -->
    <div class="hidden md:block mt-2 text-center">
        <span class="text-xs text-text-secondary">Konfirmasi</span>
    </div>
</div>
    <!-- JavaScript for Mobile Menu Toggle -->
    <script>
    const mobileMenu = document.getElementById('mobile-menu');
    const overlay = document.getElementById('overlay');
    const menuButton = document.getElementById('mobile-menu-button');

    menuButton.addEventListener('click', function() {
        if (mobileMenu.classList.contains('-translate-x-full')) {
            // BUKA MENU
            mobileMenu.classList.remove('-translate-x-full');
            mobileMenu.classList.add('translate-x-0');
            mobileMenu.classList.remove('slide-out');
            mobileMenu.classList.add('slide-in');

            // Tampilkan overlay dengan animasi fade-in
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                overlay.classList.add('opacity-100');
            }, 10); // Delay kecil agar transisi terlihat

            // Disable scroll
            document.body.style.overflow = 'hidden';

        } else {
            // TUTUP MENU
            mobileMenu.classList.remove('translate-x-0');
            mobileMenu.classList.add('-translate-x-full');
            mobileMenu.classList.remove('slide-in');
            mobileMenu.classList.add('slide-out');

            // Fade-out overlay
            overlay.classList.remove('opacity-100');
            overlay.classList.add('opacity-0');

            setTimeout(() => {
                overlay.classList.add('hidden');
                // Enable scroll
                document.body.style.overflow = '';
            }, 300); // Sesuaikan dengan durasi transisi CSS
        }
    });

    // Close menu when clicking overlay
    overlay.addEventListener('click', function() {
        mobileMenu.classList.remove('translate-x-0');
        mobileMenu.classList.add('-translate-x-full');
        mobileMenu.classList.remove('slide-in');
        mobileMenu.classList.add('slide-out');

        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');

        setTimeout(() => {
            overlay.classList.add('hidden');
            document.body.style.overflow = '';
        }, 300);
    });
</script>
    
    <script type="module">
    import EdgeRunnerAPI from './koneksi.js';

    const listContainer = document.getElementById('sales-list');
    const confirmBtn = document.getElementById('confirm-sales-btn');

    function formatRupiah(n) {
        const num = Number(n) || 0;
        return 'Rp ' + num.toLocaleString('id-ID');
    }

    function renderLoading() {
        listContainer.innerHTML = '<div class="col-span-full text-text-secondary text-center">Memuat produk...</div>';
    }

    function renderEmpty() {
        listContainer.innerHTML = '<div class="col-span-full text-text-secondary text-center">Belum ada produk</div>';
    }

    async function loadProductsForSale() {
        renderLoading();
        try {
            const products = await EdgeRunnerAPI.getProduk();
            if (!products || !products.length) {
                renderEmpty();
                return;
            }

            listContainer.innerHTML = '';
            for (const p of products) {
                const row = document.createElement('div');
                row.className = 'bg-element-bg rounded-xl p-4 flex sm:flex-row sm:items-center justify-between gap-3';
                row.dataset.id = p.id;

                const left = document.createElement('div');
                left.innerHTML = `<h3 class="font-bold">${escapeHtml(p.nama)}</h3><p class="text-sm text-text-secondary">${formatRupiah(p.harga)}</p>`;

                const right = document.createElement('div');
                right.className = 'flex items-center gap-2';
                right.innerHTML = `
                    <span class="text-sm">Jumlah :</span>
                    <input type="number" min="0" value="0" class="w-16 px-2 py-1 bg-main-bg border border-accent rounded text-text-main text-center qty-input" />
                `;

                row.appendChild(left);
                row.appendChild(right);
                listContainer.appendChild(row);
            }
        } catch (err) {
            console.error('Gagal memuat produk', err);
            listContainer.innerHTML = '<div class="col-span-full text-center text-text-secondary">Gagal memuat produk</div>';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function (s) {
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[s];
        });
    }

    confirmBtn.addEventListener('click', async () => {
        const rows = Array.from(listContainer.querySelectorAll('[data-id]'));
        const tasks = [];
        for (const row of rows) {
            const id = row.dataset.id;
            const input = row.querySelector('.qty-input');
            const qty = Number(input.value) || 0;
            if (qty > 0) {
                tasks.push(EdgeRunnerAPI.addPenjualan({ produkId: id, jumlah: qty }));
            }
        }

        if (!tasks.length) {
            alert('Pilih jumlah penjualan terlebih dahulu');
            return;
        }

        confirmBtn.disabled = true;
        confirmBtn.classList.add('opacity-60');
        try {
            await Promise.all(tasks);
            alert('Penjualan berhasil dicatat');
            // reset inputs
            rows.forEach(r => { const i = r.querySelector('.qty-input'); if (i) i.value = 0; });
            // reload ekonomi/penjualan view if any (we just reload products list)
            await loadProductsForSale();
        } catch (err) {
            console.error('Gagal menyimpan penjualan', err);
            alert('Terjadi kesalahan saat menyimpan penjualan');
        } finally {
            confirmBtn.disabled = false;
            confirmBtn.classList.remove('opacity-60');
        }
    });

    // initial
    loadProductsForSale();

    </script>
</body>
