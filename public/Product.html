<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeRunner</title>
  <link rel="stylesheet" href="global.css">
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body>
  <div class="topbar">
    <div class="tleft">
      <div class="burger" onclick="toggleSideBar()">
        <span></span><span></span><span></span>
      </div>
      <img class="logo" src="bege.jpg">
    </div>
    <h2>Product Page</h2>
    <div></div>
  </div>

  <div class="mainlayout">
    <div class="sidebarc">
      <nav class="sidebar">
        <ol class="mainside">
          <li><a href="http://localhost:8158/dashb.html"><i id="icon" class="fi fi-rr-chart-histogram"></i>Sales Dashboard</a></li>
          <li><a href="http://localhost:8158/addproduct.html"><i id="icon" class="fi fi-rr-shopping-cart"></i>Add Penjualan</a></li>
          <li><a href="http://localhost:8158/Product.html"><i id="icon" class="fi fi-rr-edit"></i>Product</a></li>
        </ol>
        <ol class="otherside">
          <li><a>Dashboard</a></li>
          <li><a>Dashboard</a></li>
          <li><a>Dashboard</a></li>
        </ol>
      </nav>
    </div>

    <div class="mainproduct">
      <div class="div judul2">
        <select id="kategori">
          <option value="makanan">Makanan</option>
          <option value="minuman">Minuman</option>
        </select>
        <button class="addproduk" id="openPopup">+ Add Produk</button>
      </div>

      <div class="div contproduk">
       <div class="listc">
        <div id="listProduk" class="div list">
          <div class="nameprice">
            <div class="name"><p>1. Saus putih</p></div>
            <div class="price"><p>10000/pcs</p></div>
          </div>
          <div class="img"><img class="photo" src="bege.jpg"></div>
          <div class="edit">
            <button class="edit1 btn">Edit</button>
            <button class="remove btn">Hapus</button>
           </div>
         </div>
        </div>
      </div>
    </div>
  </div>
  <div id="popupOverlay" class="popupOverlay">
    <div class="popupBox">
      <h3>Add Produk</h3>

      <label>Kategori</label>
      <select id="popupKategori">
        <option value="makanan">Makanan</option>
        <option value="minuman">Minuman</option>
      </select>

      <label>Nama Produk</label>
      <input id="popupNama" type="text" placeholder="Masukkan nama produk">

      <label>Harga</label>
      <input id="popupHarga" type="number" placeholder="Masukkan harga">

      <label>Foto Produk (JPG / PNG)</label>
      <input id="popupFoto" type="file" accept="image/jpg, image/jpeg, image/png">

      <img id="previewFoto" class="previewFoto" style="display:none;">

      <div class="popupBtn">
        <button id="closePopup" class="closeBtn">Cancel</button>
        <button id="submitProduk" class="submitBtn">Submit</button>
      </div>
    </div>
  </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="burger.js"></script>
<script src="addproduct.js"></script>
</html>
