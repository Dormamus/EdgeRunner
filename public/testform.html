<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Daftar Produk</h1>

    <table border="1" id="produk-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>Harga</th>
            <th>Aksi</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
    <h2>Tambah Produk</h2>
    <form id="form-produk">
        <input type="text" id="nama" placeholder="Nama produk" required>
        <input type="number" id="harga" placeholder="Harga" required>
        <button type="submit">Tambah</button>
    </form>
    <script src="produk.js"></script>

</body>
</html>
