<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 500px; margin: 20px 0; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
        #preview { margin-top: 20px; }
        #preview img { max-width: 200px; max-height: 200px; border: 1px solid #ccc; }
        #message { display: none; margin-top: 20px; padding: 15px; background: #d4edda; border: 1px solid #c3e6cb; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Tambah Produk</h2>
    <form id="produkForm">
        <label for="nama">Nama Produk:</label>
        <input type="text" id="nama" name="nama" required><br>
        
        <label for="harga">Harga Produk:</label>
        <input type="number" id="harga" name="harga" required><br>
        
        <label for="kategori">Kategori:</label>
        <select id="kategori" name="kategori" required>
            <option value="">-- Pilih Kategori --</option>
            <option value="makanan">Makanan</option>
            <option value="minuman">Minuman</option>
            <option value="barang">Barang</option>
        </select><br>
        
        <label for="gambar">Gambar Produk:</label>
        <input type="file" id="gambar" name="gambar" accept="image/*"><br>
        
        <div id="preview"></div>
        
        <button type="submit">Simpan Produk</button>
    </form>
    
    <div id="message">
        <h2>✓ Produk Telah Ditambahkan!</h2>
        <button onclick="location.href='addProduk.html'">Tambah Lagi</button>
        <button onclick="location.href='Produk.html'">Lihat Produk</button>
    </div>
    
    <script type="module">
        import EdgeRunnerAPI from './console/koneksi.js';
        
        const form = document.getElementById('produkForm');
        const messageDiv = document.getElementById('message');
        const gambarInput = document.getElementById('gambar');
        const previewDiv = document.getElementById('preview');
        
        // Preview gambar
        gambarInput.addEventListener('change', (e) => {
            previewDiv.innerHTML = '';
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    previewDiv.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const harga = parseFloat(document.getElementById('harga').value);
            const kategori = document.getElementById('kategori').value;
            const gambarFile = document.getElementById('gambar').files[0];
            
            try {
                // Buat FormData untuk mengirim file
                const formData = new FormData();
                formData.append('nama', nama);
                formData.append('harga', harga);
                formData.append('kategori', kategori);
                if (gambarFile) {
                    formData.append('gambar', gambarFile);
                }
                
                // Kirim langsung dengan fetch (bypass EdgeRunnerAPI karena butuh FormData)
                const response = await fetch('http://localhost:3000/api/produk', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Gagal menambahkan produk');
                }
                
                const result = await response.json();
                console.log('Produk ditambahkan:', result);
                
                form.style.display = 'none';
                messageDiv.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('Gagal menambahkan produk: ' + error.message);
            }
        });
    </script>
</body>
</html>
