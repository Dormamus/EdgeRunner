<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk</title>
</head>
<body>
    <h2>Tambah Produk</h2>
    <form action="" method="post">
        <label for="nama">Nama Produk:</label><br>
        <input type="text" id="nama" name="nama" required><br><br>
        <label for="harga">Harga Produk:</label><br>
        <input type="number" id="harga" name="harga" required><br><br>
        <select id="kategori" name="kategori">
            <option value="makanan">Makanan</option>
            <option value="minuman">Minuman</option>
            <option value="barang">Barang</option>
            <option value="tambahkanKategori">Tambahkan kategori...</option>
        </select> <br><br>
        <button type="submit" onclick="">Simpan Produk</button>
    </form>
    <div id="message" style="display:none;">
        <h2>Produk Telah Ditambahkan!</h2>
        <button onclick="location.href='addProduk.html'">Tambah Lagi</button>
        <button onclick="location.href='Produk.html'">Kembali</button>
    </div>
    <script type="module">
        import EdgeRunnerAPI from './script.js';
        const form = document.querySelector('form');
        const messageDiv = document.getElementById('message');
        form.addEventListener('submit', async (e) =>{
            e.preventDefault();
            const nama = document.getElementById('nama').value;
            const harga = parseFloat(document.getElementById('harga').value);
            const kategori = document.getElementById('kategori').value;
            const produkBaru = { nama, harga, kategori };
            try {
                await EdgeRunnerAPI.addProduk(produkBaru);
                form.style.display = 'none';
                messageDiv.style.display = 'block';
            } catch (error) {
                console.error('Error menambahkan produk:', error);
            }
        })
    </script>
</body>
</html>
